<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>长征文献试点</title>
<style>body{font:16px/1.7 system-ui;max-width:1100px;margin:36px auto;padding:0 20px;background:#f7f5f0;color:#242421}h1{margin-bottom:0}button,input,select,textarea{font:inherit;padding:8px;margin:4px;border:1px solid #aaa;border-radius:4px}button{cursor:pointer;background:#fff}input{width:65%}article{background:white;border:1px solid #ddd;margin:15px 0;padding:18px}pre{white-space:pre-wrap;max-height:400px;overflow:auto}small{color:#555}a{color:#854326}#message{white-space:pre-wrap}label{display:block}</style>
<h1>长征官方文献试点</h1><p>采集 · 证据 · 人工核对。自动提取结果须核对，空白表示未提取，不代表历史事实不存在。</p>
<section><h2>自动检索官方来源</h2><p>遍历官方站点首页、种子、sitemap 与链接分页，按长征及各部队关键词筛选采集。公开可达页面之外的资料不在覆盖保证内。</p><label>本轮最多检索页数 <input id="crawlLimit" type="number" min="1" max="100000" value="200" style="width:100px"></label><label>最大链接深度 <input id="crawlDepth" type="number" min="0" max="30" value="4" style="width:100px"></label><button onclick="startCrawl()">启动 / 断点继续</button><button onclick="startCrawl(true)">重试失败并继续</button><button onclick="pauseCrawl()">暂停</button><button onclick="crawlStatus()">刷新检索进度</button><pre id="crawlStatus" aria-live="polite"></pre></section>
<nav><button onclick="showDocs()">文献库</button><button onclick="showEvents()">事件与时间线</button><button onclick="exportData()">导出 JSON / CSV / Markdown</button><button onclick="showJobs()">任务状态</button></nav>
<section><h2>采集官方文献</h2><label>官方原文网址<input id="url" placeholder="输入白名单机构文献网址"><button onclick="collect()">采集</button></label><details><summary>检索入口与试点种子</summary><p>点击站点检索，在机构网站内查找长征史料，再将原文网址填入上方。程序不接入商业搜索 API，也不自动扫描整站。</p><div id="sources"></div></details></section>
<label>全文检索<input id="query" placeholder="人物、部队、地点或关键词"><button onclick="showDocs()">查找</button></label><p id="message" role="status"></p><main id="results"></main>
<script>
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function startCrawl(retry=false){try{const result=await api('/api/crawl',{limit:Number($('crawlLimit').value),depth:Number($('crawlDepth').value),retry});$('message').textContent=result.message;await crawlStatus()}catch(e){$('message').textContent=e.message}}
async function pauseCrawl(){try{$('message').textContent=(await api('/api/crawl/stop',{})).message}catch(e){$('message').textContent=e.message}}
async function crawlStatus(){try{const s=await api('/api/crawl');$('crawlStatus').textContent=(s.running?'运行中':'已停止')+'\n'+s.scope+'\n'+JSON.stringify(s.counts,null,2)+'\n最近记录：\n'+s.recent.map(r=>r.state+' '+r.url+(r.matched?' '+r.matched:'')+(r.error?'\n'+r.error:'')).join('\n')}catch(e){$('message').textContent=e.message}}
async function api(path,data){const r=await fetch(path,data?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)}:{});const v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function collect(){try{$('message').textContent=(await api('/api/collect',{url:$('url').value})).message;showJobs()}catch(e){$('message').textContent=e.message}}
async function showJobs(){const rows=await api('/api/jobs');$('results').innerHTML=rows.map(r=>`<article>${esc(r.state)} — ${esc(r.url)}<p>${esc(r.message)}</p></article>`).join('')||'暂无任务；采集后点击任务状态刷新。'}
async function showDocs(){const rows=await api('/api/documents?q='+encodeURIComponent($('query').value));$('results').innerHTML=rows.map(r=>`<article><h2>${esc(r.title)}</h2><p>${esc(r.institution)} · ${esc(r.kind)} · ${esc(r.status)}</p><a href="${esc(r.url)}" target="_blank" rel="noreferrer">官方原文</a><p>文献编号 ${esc(r.id)} · 发布日期 ${esc(r.published||'未识别')} · 采集 ${esc(r.collected)}</p><button onclick="reviewDoc('${r.id}','已确认')">确认为纳入文献</button><button onclick="reviewDoc('${r.id}','排除')">排除</button><details><summary>正文与图片记录</summary><pre>${esc(r.body)}</pre><pre>${esc(JSON.stringify(JSON.parse(r.images),null,2))}</pre><small>原件：${esc(r.raw_path)}；SHA256：${esc(r.sha256)}</small></details></article>`).join('')||'暂无匹配文献。'}
async function reviewDoc(id,status){await api('/api/review',{type:'document',id,status});showDocs()}
let events=[];
async function showEvents(){events=await api('/api/events');events.sort((a,b)=>{const key=r=>{const m=r.date_text.match(/(\d+)年(\d+)月(?:(\d+)日)?/);return m?+m[1]*10000+ +m[2]*100+ +(m[3]||0):0};return key(a)-key(b)});$('results').innerHTML=events.map((r,i)=>`<article><h2>${esc(r.date_text)} · ${esc(r.status)}</h2><label>事件名称<textarea id="name${i}" rows="2" style="width:90%">${esc(r.name)}</textarea></label><p>${esc(r.event_type)}；日期精度：${esc(r.date_precision)}</p><p>部队：${esc(r.units)}<br>人物：${esc(r.people)}<br>地点：${esc(r.places)}</p><blockquote>${esc(r.evidence)}</blockquote><a href="${esc(r.source_url)}" target="_blank" rel="noreferrer">${esc(r.document_title)}</a> · ${esc(r.locator)}<label>核对说明<textarea id="note${i}">${esc(r.notes)}</textarea></label><button onclick="reviewEvent(${i},'已确认')">确认</button><button onclick="reviewEvent(${i},'排除')">排除</button><button onclick="reviewEvent(${i},'待核对')">保存为待核对</button></article>`).join('')||'暂无事件。规则只提取带明确 1934—1936 年日期的句段。'}
async function reviewEvent(i,status){await api('/api/review',{type:'event',id:events[i].id,status,name:$('name'+i).value,notes:$('note'+i).value});showEvents()}
async function exportData(){await api('/api/export');$('message').textContent='已导出至试点数据目录的 exports 文件夹；文件保留核对状态，请按状态筛选。'}
api('/api/sources').then(rows=>{$('sources').innerHTML=rows.map(r=>`<p><a target="_blank" rel="noreferrer" href="https://${esc(r.host)}">${esc(r.institution)}：站点检索</a></p>`+r.seeds.map(url=>`<p>${esc(url)} <button data-url="${esc(url)}" onclick="$('url').value=this.dataset.url">填入种子网址</button></p>`).join('')).join('')});showDocs();
</script></html>
